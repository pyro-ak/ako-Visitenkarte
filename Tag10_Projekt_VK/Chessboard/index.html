<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chessboard</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="board">

        <div class="boxes">
            <div class="boxA1" id="box1">A1</div>
            <div class="boxA2">A2</div>
            <div class="boxA3">A3</div>
            <div class="boxB1">B1
                <div class="figuren">
                    <img class="knight"  src="Icons/Figuren png/knight.png" alt="bild">
                </div>
            </div>
            <div class="boxB2">B2</div>
            <div class="boxB3">B3</div>
            <div class="boxC1">C1</div>
            <div class="boxC2">C2</div>
            <div class="boxC3">C3</div>
            <div class="boxD1">D1</div>
            <div class="boxD2">D2</div>
            <div class="boxD3">D3</div>
            <div class="boxE1">E1</div>
            <div class="boxE2">E2</div>
            <div class="boxE3">E3</div>
        </div>

      <div class="intro">
            <p>Knight to C3</p>
        </div>
        
    </div>
</body>

</html>
