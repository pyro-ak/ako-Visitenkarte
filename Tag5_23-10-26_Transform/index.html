<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movement</title>
    <link rel="stylesheet" href="style1.css">
</head>

<body>

    <section>
  <h1>transform: verschoben</h1>

  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed verschoben">x- und y-Achse 100, 200px</p> </div>
  </div>
</section>

    <section>
  <h1>transform: rotate</h1>

  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed rotieren">-37deg</p> </div>
  </div>
</section>

    <section>
  <h1>transform: scale</h1>

  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed scale">x: 0.8 y: 1.2</p> </div>
  </div>
</section>

    <section>
  <h1>transform: skew</h1>

  <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed skew">verzerren</p> </div>
  </div>
</section>

<section>
    <h1>transform: combination</h1>

   <div class="group">
    <div class="not_transformed"></div>
    <div class="transformed combination">comb: rotate & scale</p> </div>
  </div>
</section>

</body>

</html>
